name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: ubuntu-latest
            compiler: clang++
          - os: macos-latest
            compiler: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Example
        run: ./build/basic_usage
      - name: Latency smoke run
        run: ./build/lob_latency
      - name: Converter tests (Binance sync protocol)
        run: python3 -m unittest discover -s tools/binance -v
      - name: Replay real BTCUSDT sample and validate against exchange snapshots
        run: |
          python3 tools/binance/convert.py data/sample/btcusdt_sample.jsonl.gz build/sample.lob
          ./build/lob_replay build/sample.lob
      - name: Validate the 1-hour recording against 12 exchange snapshots
        run: |
          python3 tools/binance/convert.py data/btcusdt_1h.jsonl.gz build/btcusdt_1h.lob
          ./build/lob_replay build/btcusdt_1h.lob --top 0
      - name: Market-making backtest (1 hour, full grid)
        run: ./build/lob_mm_backtest build/btcusdt_1h.lob --sweep

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLOB_SANITIZE=ON -DLOB_BUILD_BENCHMARKS=OFF -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Replay sample under sanitizers
        run: |
          python3 tools/binance/convert.py data/sample/btcusdt_sample.jsonl.gz build/sample.lob
          ./build/lob_replay build/sample.lob --top 0
          ./build/lob_mm_backtest build/sample.lob --sweep
